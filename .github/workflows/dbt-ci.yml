name: dbt CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  dbt-validate:
    name: Validate dbt project
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: walmart_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt and Databricks adapter
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-databricks==1.12.3"

      - name: Install dbt packages
        run: dbt deps

      - name: Validate dbt project
        run: dbt parse