snapshots:
  - name: dim_stores
    relation: ref('eph_stores')
    config:
      schema: gold
      database: walmart_catalog
      unique_key: store_id
      strategy: timestamp
      updated_at: store_snapshot_updated_at
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.